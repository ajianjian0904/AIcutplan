<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制作流水线 · 漫剪校对台</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/flow.css">
</head>
<body>

<header class="topbar">
  <div class="brand">制作流水线 <span id="projName" class="brand-sub"></span></div>
  <nav class="appnav">
    <a href="/flow" class="on">流水线</a>
    <a href="/shots">镜头台</a>
    <a href="/asr">台词台</a>
    <a href="/narration">旁白</a>
    <a href="/review">逐句校对</a>
    <a href="/">锚点</a>
    <a href="/deliver">交付</a>
  </nav>
  <div class="actions">
    <input id="dirInput" class="dir-input" type="text" spellcheck="false" placeholder="工程目录绝对路径">
    <button id="btnLoad">载入</button>
    <button id="btnNew" class="primary">新建工程</button>
    <button id="btnRefresh" title="重新扫描产物">刷新</button>
  </div>
</header>

<main class="flow-ws">
  <section class="panel flow-left">
    <div class="panel-head">
      一集从 0 到成片
      <span id="sumText" class="muted"></span>
      <span class="grow"></span>
      <span id="docChip" class="chip"></span>
    </div>
    <div class="prog-wrap"><div class="prog"><div id="progBar" class="prog-bar"></div></div></div>
    <div id="stepList" class="step-list"></div>
    <div class="flow-foot">
      <span class="muted">产物齐了才亮绿；点击任一步看它要什么、能跑什么</span>
      <button id="btnRebuild" class="ghost sm">重跑命令</button>
    </div>
  </section>

  <aside class="flow-right">
    <section class="panel detail" id="detailPanel">
      <div class="empty">左侧点一步</div>
    </section>

    <section class="panel runpanel">
      <div class="panel-head">
        运行
        <span id="jobChip" class="chip"></span>
        <span class="grow"></span>
        <button id="btnStop" class="danger sm" disabled>停止</button>
      </div>
      <div class="panel-body run-body">
        <div id="runForm" class="run-form"></div>
        <div id="jobMeta" class="job-meta muted"></div>
        <div class="job-prog"><div id="jobBar" class="job-bar"></div></div>
        <pre id="logBox" class="logbox">选择一步，点「运行」；日志会实时出现在这里。</pre>
      </div>
    </section>
  </aside>
</main>

<div id="newModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head"><span>新建工程</span><button id="newClose" class="ghost">关闭</button></div>
    <p class="cmd-note">只建骨架：<code>project.json</code> + audio/json/out/tts/logs/verify/scripts 空目录，<b>不复制、不改动源视频</b>。建完自动载入，接着跑「洗片」。</p>
    <div class="new-grid">
      <label class="fld"><span>工程目录</span><input id="nwDir" type="text" spellcheck="false" placeholder="E:/workbuddy/xxx/ep06"></label>
      <label class="fld"><span>源视频完整路径</span><input id="nwVideo" type="text" spellcheck="false" placeholder="E:/videos/ep06.mp4" title="可以直接把文件拖到这个输入框"></label>
      <label class="fld"><span>剧集名称</span><input id="nwName" type="text" spellcheck="false" placeholder="世界最强的魔女 EP06"></label>
      <div class="fld-row">
        <label class="fld"><span>原语言</span>
          <select id="nwLang">
            <option value="ja">日语</option><option value="en">英语</option>
            <option value="ko">韩语</option><option value="zh">中文</option>
            <option value="es">西语</option><option value="fr">法语</option>
          </select>
        </label>
        <label class="fld"><span>目标成片时长（秒）</span><input id="nwTarget" type="number" value="324" min="60" max="1200"></label>
        <label class="fld"><span>帧率</span><input id="nwFps" type="number" value="24" min="12" max="60"></label>
      </div>
      <label class="check"><input id="nwForce" type="checkbox"> 允许写入非空目录（会覆盖同名 project.json）</label>
    </div>
    <div class="modal-foot">
      <button id="btnCreate" class="primary">建工程并载入</button>
      <span id="nwTip" class="muted"></span>
    </div>
  </div>
</div>

<div id="cmdModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head"><span>重跑命令</span><button id="cmdClose" class="ghost">关闭</button></div>
    <p class="cmd-note">写回 cutplan 之后必须按顺序重跑，否则下次对齐会把改动覆盖掉。流水线页可以直接点「运行」跑这几步，不必手动贴命令。</p>
    <pre id="cmdBody" class="logbox light"></pre>
    <div class="modal-foot"><button id="cmdCopy">复制全部</button></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/flow.js"></script>
</body>
</html>
