name: tests

on:
  push:
    branches: [main, cut-first]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 项目核心零第三方依赖；可编辑安装用于验证包发现包含全部子包
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Import smoke test
        run: python -c "from aicutplan.batch import planner, pipeline; import aicutplan; print(aicutplan.__version__)"

      # tests/ 全部为标准库 unittest，零 ffmpeg / 零网络 / 零 API / 零模型
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Compile check
        run: python -m compileall -q aicutplan tests
